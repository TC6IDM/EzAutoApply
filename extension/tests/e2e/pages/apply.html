<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Software Engineer at Initech</title>
    <style>
      body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
      .field { margin: 12px 0; display: flex; flex-direction: column; gap: 4px; }
      .dropzone { border: 2px dashed #999; padding: 16px; }
      .dropzone input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
      [role=listbox] { border: 1px solid #ccc; }
      [role=option] { padding: 4px; cursor: pointer; }
      iframe { width: 100%; height: 260px; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <h1>Software Engineer, Initech</h1>
    <form id="application" onsubmit="event.preventDefault(); document.body.dataset.submitted = 'yes';">
      <h2>Personal information</h2>
      <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required /></div>
      <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required /></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" /></div>
      <div class="field">
        <span id="country-label">Country</span>
        <div class="cb"><input id="country" role="combobox" aria-labelledby="country-label" aria-controls="country-list" aria-expanded="false" aria-autocomplete="list" /></div>
        <div id="country-list" role="listbox" hidden></div>
      </div>
      <div class="field">
        <label for="resume">Resume/CV *</label>
        <div class="dropzone">Drop your resume here <input type="file" id="resume" name="resume" required /></div>
      </div>
      <div class="field">
        <label for="cover_letter">Cover Letter</label>
        <div class="dropzone">Drop your cover letter here <input type="file" id="cover_letter" name="cover_letter" /></div>
      </div>

      <h2>Questions</h2>
      <fieldset>
        <legend>Are you legally authorized to work in the United States? *</legend>
        <label><input type="radio" name="q_auth" value="yes" required /> Yes</label>
        <label><input type="radio" name="q_auth" value="no" /> No</label>
      </fieldset>
      <div class="field">
        <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
        <select id="sponsor" name="sponsor">
          <option value="">Select...</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div class="field">
        <label for="why">Why do you want to work at Initech? *</label>
        <textarea id="why" name="why" required></textarea>
      </div>
      <button type="submit">Submit application</button>
    </form>

    <h2>Additional details</h2>
    <iframe src="/frame.html" title="Additional details"></iframe>

    <script>
      // Like most upload widgets, show the chosen file's name.
      for (const input of document.querySelectorAll('.dropzone input[type=file]')) {
        const name = document.createElement('div');
        name.className = 'file-name';
        input.closest('.dropzone').after(name);
        input.addEventListener('change', () => (name.textContent = [...input.files].map((f) => f.name).join(', ')));
      }

      // A react-select-style dropdown: options render only while it's open.
      const input = document.getElementById('country');
      const list = document.getElementById('country-list');
      const countries = ['Canada', 'Mexico', 'United Kingdom', 'United States of America'];
      function render(filter) {
        list.innerHTML = '';
        for (const c of countries.filter((x) => x.toLowerCase().includes(filter.toLowerCase()))) {
          const o = document.createElement('div');
          o.setAttribute('role', 'option');
          o.textContent = c;
          o.addEventListener('click', () => {
            input.value = c;
            input.dataset.selected = c;
            list.hidden = true;
            input.setAttribute('aria-expanded', 'false');
          });
          list.appendChild(o);
        }
      }
      input.addEventListener('mousedown', () => { render(''); list.hidden = false; input.setAttribute('aria-expanded', 'true'); });
      input.addEventListener('input', () => { render(input.value); list.hidden = false; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') list.hidden = true; });
    </script>
  </body>
</html>
